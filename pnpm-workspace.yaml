allowBuilds:
  # Vite's bundler backend — post-install fetches the platform-specific native binary.
  esbuild: true
  # libvips binding used by vite-plugin-image-optimizer — post-install builds/fetches native binaries.
  sharp: true

overrides:
  # Patches serialize-javascript RCE + DoS (GHSA-5c6j-r48x-rmvq, GHSA-qj8w-gfj5-8c6v)
  # reached transitively via vite-plugin-pwa → workbox → @rollup/plugin-terser.
  serialize-javascript: ^7.0.5